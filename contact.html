<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Algets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{color:#fff;background:linear-gradient(-45deg,#0f172a,#111827,#1e293b,#0f172a);background-size:400% 400%;animation:bg 12s ease infinite}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
nav{

position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:1200px;

display:flex;
justify-content:space-between;
align-items:center;

padding:15px 30px;

background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.12);

border-radius:15px;

z-index:999;

}

nav h2{

font-size:28px;
font-weight:700;

background:linear-gradient(90deg,#00d4ff,#4ade80);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

nav ul{

display:flex;
gap:35px;
list-style:none;

}

nav ul li a{

text-decoration:none;
color:white;
font-weight:500;
transition:.35s;

position:relative;

}

nav ul li a::after{

content:"";
position:absolute;
bottom:-6px;
left:0;
height:2px;
width:0;
background:#00d4ff;
transition:.3s;

}

nav ul li a:hover{

color:#00d4ff;

}

nav ul li a:hover::after{

width:100%;

}

.menu-icon{

display:none;
font-size:28px;
cursor:pointer;

}

.sidebar{position:fixed;right:-260px;top:0;width:250px;height:100%;background:#111827;padding-top:80px;transition:.3s;z-index:10}
.sidebar.active{right:0}.sidebar ul{list-style:none;padding:20px}.sidebar a{color:#fff;text-decoration:none}
.overlay{display:none}.overlay.show{display:block;position:fixed;inset:0;background:#0008}
.contact{max-width:1200px;margin:auto;padding:40px 20px 80px;margin-top:100px;}
.contact h1{text-align:center;font-size:48px;margin-bottom:40px}
.contact-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:30px}
.panel{background:rgba(255,255,255,.08);border-radius:20px;padding:30px;border:1px solid rgba(255,255,255,.08);transition:.3s}
.panel:hover{transform:translateY(-8px)}
.contact-item{display:flex;align-items:center;gap:15px;margin:20px 0}
.contact-item i{font-size:24px;color:#00d4ff;width:30px}
.contact-item a,.contact-item span{color:#e5e7eb;text-decoration:none}
input,textarea{width:100%;padding:15px;margin:12px 0;background:#ffffff10;border:1px solid #ffffff22;border-radius:12px;color:#fff;outline:none}
textarea{min-height:150px;resize:vertical}
button{padding:14px 28px;border:none;border-radius:30px;background:#00d4ff;color:#000;font-weight:600;cursor:pointer;transition:.3s}
button:hover{background:#4ade80;transform:translateY(-3px)}
.social{display:flex;gap:15px;margin-top:25px}
.social a{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ffffff10;color:#fff;text-decoration:none;transition:.3s}
.social a:hover{background:#00d4ff;color:#000}
footer{text-align:center;padding:28px;background:#0005}
@media(max-width:768px){nav ul{display:none}.menu-icon{display:block}.contact-grid{grid-template-columns:1fr}.contact h1{font-size:38px}}
</style>
</head>
<body>
<nav><h2>Algets</h2><ul><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="projects.html">Projects</a></li><li><a href="contact.html">Contact</a></li></ul><div class="menu-icon" onclick="openMenu()"><i class="fa-solid fa-bars"></i></div></nav>
<div class="sidebar" id="sidebar"><ul><li><a href="index.html" onclick="closeMenu()">Home</a></li><br><li><a href="about.html" onclick="closeMenu()">About</a></li><br><li><a href="projects.html" onclick="closeMenu()">Projects</a></li><br><li><a href="contact.html" onclick="closeMenu()">Contact</a></li></ul></div>
<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<section class="contact">
<h1>Contact Me</h1>
<div class="contact-grid">
<div class="panel">
<h2>Let's Connect</h2>
<div class="contact-item"><i class="fa-solid fa-envelope"></i><a href="mailto:algetes2004@gmail.com">algetes2004@gmail.com</a></div>
<div class="contact-item"><i class="fa-solid fa-phone"></i><span>+91 93611 19656</span></div>
<div class="contact-item"><i class="fa-solid fa-location-dot"></i><span>Ariyalur, Tamil Nadu, India</span></div>
<div class="social">
<a href="https://github.com/Algets07" target="_blank"><i class="fa-brands fa-github"></i></a>
<a href="https://www.linkedin.com/in/algets-s-4b6762304/" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
<a href="mailto:algetes2004@gmail.com"><i class="fa-solid fa-envelope"></i></a>
</div>
</div>
<div class="panel">
<form id="contactForm">
<input id="name" type="text" placeholder="Your Name" required>
<input id="email" type="email" placeholder="Your Email" required>
<textarea id="message" placeholder="Your Message" required></textarea>
<button type="submit">Send Message</button>
</form>
</div>
</div>
</section>
<footer>© 2026 Algets S | All Rights Reserved</footer>
<script>
function openMenu(){sidebar.classList.add('active');overlay.classList.add('show')}
function closeMenu(){sidebar.classList.remove('active');overlay.classList.remove('show')}
document.getElementById('contactForm').addEventListener('submit',e=>{
e.preventDefault();
alert('Thank you! Your message has been received.');
e.target.reset();
});
</script>
</body></html>
